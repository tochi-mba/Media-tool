[project]
name = "media-tool"
version = "0.1.0"
description = "Async media-download service: submit media items, get files fetched by an automated headless browser."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "tochi-mba" }]
keywords = ["fastapi", "playwright", "automation", "media", "mcp"]
classifiers = [
    "Private :: Do Not Upload",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "structlog>=24.4",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
# Installed only where the service actually drives a browser. The package imports
# cleanly without it; see docs/architecture.md.
browser = ["playwright>=1.47"]

[project.scripts]
media-tool = "media_tool.__main__:main"

[project.urls]
Repository = "https://github.com/tochi-mba/Media-tool"

[dependency-groups]
dev = [
    "hypothesis>=6.112",
    "httpx>=0.27",
    "import-linter>=2.1",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/media_tool"]

# --------------------------------------------------------------------------------------
# Lint / format
# --------------------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "A",      # builtin shadowing
    "ANN",    # missing annotations
    "ARG",    # unused arguments
    "ASYNC",  # async correctness
    "B",      # bugbear
    "C4",     # comprehensions
    "DTZ",    # naive datetimes
    "E",      # pycodestyle errors
    "EM",     # exception message hygiene
    "ERA",    # commented-out code
    "F",      # pyflakes
    "FA",     # future annotations
    "I",      # import sorting
    "ICN",    # import conventions
    "N",      # pep8-naming
    "PERF",   # performance anti-patterns
    "PIE",
    "PL",     # pylint subset
    "PT",     # pytest style
    "PTH",    # use pathlib
    "RET",    # return hygiene
    "RSE",
    "RUF",
    "S",      # bandit
    "SIM",    # simplify
    "SLF",    # private member access
    "T20",    # no print
    "TC",     # typing-only imports
    "TID",    # tidy imports
    "TRY",    # exception hygiene
    "UP",     # pyupgrade
    "W",      # pycodestyle warnings
]
ignore = [
    "ANN401",  # Any is occasionally the honest annotation (fake driver kwargs)
    "TRY003",  # long messages inline are clearer than an exception subclass per message
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",    # asserts are the point
    "SLF001",  # tests may inspect private state
    "PLR2004", # magic numbers are fine in assertions
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["media_tool"]

[tool.ruff.lint.pydocstyle]
convention = "google"

# --------------------------------------------------------------------------------------
# Types
# --------------------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
strict = true
warn_unreachable = true
warn_unused_ignores = true
disallow_any_unimported = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[[tool.mypy.overrides]]
module = ["playwright.*"]
ignore_missing_imports = true

# --------------------------------------------------------------------------------------
# Tests
# --------------------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "-m",
    "not live_browser",
]
markers = [
    "live_browser: drives a real Chromium process; deselected by default, run with `make test-live`",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["media_tool"]
branch = true
parallel = false

[tool.coverage.paths]
source = ["src/media_tool", "*/site-packages/media_tool"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 100
# Only non-executable lines are excluded. Nothing that contains real logic is
# excluded, and `# pragma: no cover` is not used anywhere in src/. See AGENTS.md.
exclude_also = [
    "^\\s*\\.\\.\\.$",
    "^\\s*if TYPE_CHECKING:",
    "^\\s*@(?:typing\\.)?overload$",
    "^\\s*raise NotImplementedError$",
]

# --------------------------------------------------------------------------------------
# Architecture (layering is enforced, not merely documented)
# --------------------------------------------------------------------------------------
[tool.importlinter]
root_package = "media_tool"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers point inward"
type = "layers"
layers = [
    "media_tool.api",
    "media_tool.jobs",
    "media_tool.providers",
    "media_tool.storage",
    "media_tool.domain",
]
exhaustive = false

[[tool.importlinter.contracts]]
name = "Domain is independent"
type = "forbidden"
source_modules = ["media_tool.domain"]
forbidden_modules = [
    "media_tool.api",
    "media_tool.core",
    "media_tool.jobs",
    "media_tool.providers",
    "media_tool.storage",
]

[[tool.importlinter.contracts]]
name = "Playwright stays behind the browser adapter"
type = "forbidden"
source_modules = [
    "media_tool.api",
    "media_tool.core",
    "media_tool.domain",
    "media_tool.jobs",
    "media_tool.storage",
]
forbidden_modules = ["playwright"]
# Every non-browser provider module is added to this list as it is created.
# media_tool.providers.browser is deliberately never listed: it is the single
# adapter allowed to import Playwright.
